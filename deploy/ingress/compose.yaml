# The phone ingress: one per box. Caddy on the box's own public address (ports 80 and 443), with a
# certificate it gets and renews by itself. It replaces the tunnel: no ngrok, no account.
# Each phone line on the box adds one file to sites/ (written by deploy/line/install-line.sh) that
# forwards its hostname to that line's stream port on host loopback. Only Twilio's two paths pass.
# Host network on purpose: lines publish their stream port on 127.0.0.1 only, so no Docker network
# is shared between lines, and the host firewall (ufw allow 80,443/tcp) is the truth about exposure.
name: phone-ingress
services:
  caddy:
    image: caddy:2
    container_name: phone-ingress
    restart: unless-stopped
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 100m
    cpus: "0.25"
    pids_limit: 64
    tmpfs: [/tmp, /run, /config]
    volumes:
      - ${INGRESS_DIR}/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${INGRESS_DIR}/sites:/etc/caddy/sites:ro
      - ${INGRESS_DIR}/data:/data
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
